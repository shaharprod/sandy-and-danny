<style>
:root{--bg:#fff8ef;--card:#fff;--ink:#2b2340;--muted:#6f6680;--line:#f0e2cf;--pink:#e2557f;--blue:#3a7bd5;--green:#3d9a5b;--yellow:#ffd34d;--lock:#b9a9c9;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Varela Round",Arial,sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;color:var(--ink)}
input{user-select:text;-webkit-user-select:text}
header{background:#fff;border-bottom:3px solid var(--line);padding:calc(8px + var(--sat)) calc(14px + var(--sar)) 8px calc(14px + var(--sal));display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{font-size:30px}
.brand h1{font-size:19px;margin:0;color:var(--pink)}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.hbtns{display:flex;gap:8px;align-items:center}
.pill{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:14px;font-weight:bold;min-height:40px}
.pill.main{background:var(--blue);border-color:var(--blue);color:#fff}
.pill.vip{background:var(--green);border-color:var(--green);color:#fff}
main{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:14px calc(14px + var(--sar)) 14px calc(14px + var(--sal));display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;min-width:0}
aside h2{font-size:15px;margin:2px 4px 10px}
.eps{display:flex;flex-direction:column;gap:6px;max-height:calc(100dvh - 140px);overflow:auto;overscroll-behavior:contain}
.ep{flex-shrink:0;display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 10px;text-align:start;font-size:14px;min-height:46px}
.ep .n{background:var(--yellow);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:bold;flex-shrink:0}
.ep.on{border-color:var(--pink);background:#fff0f4}
.ep.soon{opacity:.55}
.ep .em{font-size:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top h2{margin:0;font-size:18px}
.pages{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.pg{position:relative;flex-shrink:0;border:3px solid var(--line);background:#fff;border-radius:12px;padding:0;width:104px;overflow:hidden}
.pg img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.pg .cap{display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:bold;padding:2px 4px}
.pg.on{border-color:var(--pink)}
.pg.on .cap{background:var(--pink);color:#fff}
.pg.locked img{opacity:.35}
.free{display:inline-block;background:var(--green);color:#fff;border-radius:99px;padding:1px 7px;font-size:11px}

/* סרגל כלים */
.toolbar{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.trow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 12px;font-size:15px;font-weight:bold;min-height:46px;min-width:46px;justify-content:center}
.tool .ic{font-size:20px;line-height:1}
.tool.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tool[disabled]{opacity:.4;cursor:default}
.tool.hide{display:none}
.sep{flex:1}
.palette{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:40px;height:40px;flex-shrink:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--ink);transform:scale(1.12)}

/* דף הציור */
.stage{position:relative;margin-top:10px;width:100%;aspect-ratio:16/9;background:#fff;border-radius:16px;overflow:hidden;border:3px solid var(--line);touch-action:none}
.zoomer{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.zoomer canvas{position:absolute;inset:0;width:100%;height:100%}
#outline{pointer-events:none}
.lockov{position:absolute;inset:0;background:rgba(255,248,239,.93);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px;z-index:3}
.lockov.show{display:flex}
.lockov .big{font-size:54px}
.lockov p{margin:0;max-width:420px}
.loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:48px;animation:pulse 1s infinite alternate;pointer-events:none;z-index:2}
.loading.show{display:flex}
@keyframes pulse{from{opacity:.3}to{opacity:1}}
.hint{position:absolute;inset-inline:0;bottom:8px;margin:auto;width:max-content;max-width:90%;background:rgba(43,35,64,.82);color:#fff;border-radius:99px;padding:6px 14px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .4s;z-index:4;text-align:center}
.hint.show{opacity:1}

footer{text-align:center;font-size:12px;color:var(--muted);padding:14px 16px calc(24px + var(--sab))}
footer a{color:var(--muted)}

/* טאבלט */
@media (max-width:1100px){ main{grid-template-columns:225px minmax(0,1fr)} .ep{font-size:13px;padding:6px 8px} }
@media (max-width:900px){
  main{grid-template-columns:minmax(0,1fr);padding-top:10px}
  aside h2{display:none}
  aside.card{padding:8px}
  .eps{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:2px}
  .ep{min-width:0;padding:6px 10px}
}
/* טלפון */
@media (max-width:600px){
  header{padding-top:calc(6px + var(--sat));padding-bottom:6px}
  .brand .logo{font-size:24px}
  .brand h1{font-size:16px}
  .brand p{display:none}
  .pill{padding:6px 10px;font-size:13px;min-height:38px}
  main{padding:8px calc(8px + var(--sar)) 8px calc(8px + var(--sal));gap:8px}
  .card{border-radius:14px;padding:8px}
  .top h2{font-size:16px}
  .pg{width:84px}
  .tool .lbl{display:none}
  .tool{padding:6px 8px}
  .palette{flex-wrap:nowrap;overflow-x:auto;padding:4px 2px}
  .sw{width:38px;height:38px}
  .stage{border-radius:12px;margin-top:8px}
}

/* מצב מסך מלא לציור */
body.focus{overflow:hidden;position:fixed;inset:0}
body.focus header,body.focus aside,body.focus footer,body.focus .top,body.focus .pages{display:none}
body.focus main{display:block;padding:0;max-width:none}
body.focus section.card{border:none;background:transparent;padding:0}
body.focus .stage{position:fixed;margin:0;aspect-ratio:auto;z-index:30;border-width:2px}
body.focus .toolbar{position:fixed;z-index:31;margin:0;background:#fff;border-top:3px solid var(--line);inset-inline:0;bottom:0;padding:8px calc(8px + var(--sar)) calc(8px + var(--sab)) calc(8px + var(--sal))}
body.focus .tool .lbl{display:none}
body.focus .palette{flex-wrap:nowrap;overflow-x:auto}
body.focus .trow.tmore{display:none}
/* טלפון לרוחב: הכלים בעמודה בצד */
@media (orientation:landscape) and (max-height:600px){
  body.focus .toolbar{inset-inline:auto;inset-inline-end:0;top:0;bottom:0;width:128px;border-top:none;border-inline-start:3px solid var(--line);padding:calc(8px + var(--sat)) calc(8px + var(--sar)) calc(8px + var(--sab)) 8px;overflow-y:auto;flex-direction:column}
  body.focus .trow{flex-wrap:wrap;justify-content:center}
  body.focus .palette{flex-wrap:wrap;overflow:visible;justify-content:center}
  body.focus .sw{width:34px;height:34px}
  body.focus .tool{min-width:48px;min-height:44px;padding:4px}
}

.modal{position:fixed;inset:0;background:rgba(43,35,64,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.show{display:flex}
.box{background:#fff;border-radius:22px;max-width:620px;width:100%;padding:20px;max-height:92vh;overflow:auto;position:relative}
.box h3{margin:0 0 8px;font-size:21px}
.x{position:absolute;inset-inline-end:12px;top:10px;border:none;background:none;font-size:24px;color:var(--muted);min-width:44px;min-height:44px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
@media(max-width:520px){.plans{grid-template-columns:1fr}}
.plan{border:3px solid var(--line);border-radius:18px;padding:14px;text-align:center}
.plan.best{border-color:var(--green)}
.plan .price{font-size:30px;font-weight:bold;margin:6px 0}
.plan .sub{font-size:13px;color:var(--muted)}
.paybtn{display:block;width:100%;margin-top:8px;border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:bold;color:#fff;text-decoration:none}
.paypal{background:#0070ba}
.morning{background:#7a4fd1}
.paybtn.off{background:#cfc6da;pointer-events:none}
.gate input,.unlock input{font-size:20px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;width:140px;text-align:center}
.unlock input{width:240px;max-width:100%;font-size:16px}
.err{color:#c0392b;font-size:14px;min-height:18px}
.small{font-size:13px;color:var(--muted)}
#printImg{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;position:static}
  header,main,footer,.modal{display:none!important}
  #printImg{display:block;width:100%;height:auto}
}
</style>

<body>
<header>
  <div class="brand"><span class="logo">🎨</span><div><h1 id="tTitle"></h1><p id="tSub"></p></div></div>
  <div class="hbtns">
    <button class="pill" id="langBtn" onclick="switchLang()"></button>
    <button class="pill main" id="parentsBtn" onclick="openGate()"></button>
  </div>
</header>

<main>
  <aside class="card">
    <h2 id="tSeason"></h2>
    <div class="eps" id="eps"></div>
  </aside>
  <section class="card">
    <div class="top">
      <h2 id="epTitle"></h2>
    </div>
    <div class="pages" id="pages"></div>
    <div class="stage" id="stage">
      <div class="zoomer" id="zoomer">
        <canvas id="paint" width="1600" height="900"></canvas>
        <canvas id="outline" width="1600" height="900"></canvas>
      </div>
      <div class="loading" id="loading">🎨</div>
      <div class="hint" id="hint"></div>
      <div class="lockov" id="lockov">
        <div class="big" id="lockIcon">🔒</div>
        <p id="tLocked"></p>
        <button class="pill main" onclick="openGate()" id="tLockedBtn"></button>
      </div>
    </div>
    <div class="toolbar" id="toolbar">
      <div class="trow tmain">
        <button class="tool on" id="bFill" onclick="setTool('fill')"></button>
        <button class="tool" id="bBrush" onclick="setTool('brush')"></button>
        <button class="tool" id="bEraser" onclick="setTool('eraser')"></button>
        <button class="tool" id="bSize" onclick="toggleSize()"></button>
        <button class="tool" id="bUndo" onclick="undo()"></button>
        <button class="tool hide" id="bZoom" onclick="resetZoom()"></button>
        <span class="sep"></span>
        <button class="tool" id="bFocus" onclick="toggleFocus(false)"></button>
      </div>
      <div class="palette" id="palette"></div>
      <div class="trow tmore">
        <button class="tool" id="bClear" onclick="clearColor(true)"></button>
        <button class="tool" id="bSave" onclick="savePng()"></button>
        <button class="tool" id="bPrint" onclick="printPage()"></button>
      </div>
    </div>
  </section>
</main>

<footer><span id="tFooter"></span><br>SHAHAR AI PRODUCTIONS · <a href="mailto:shaharprod@gmail.com">shaharprod@gmail.com</a></footer>

<img id="printImg" alt="">

<!-- שער הורים -->
<div class="modal" id="gateModal"><div class="box gate">
  <button class="x" onclick="closeM('gateModal')">✕</button>
  <h3 id="tGateH"></h3>
  <p id="tGateQ"></p>
  <input id="gateIn" inputmode="numeric" autocomplete="off">
  <button class="pill main" onclick="checkGate()" id="tGateGo"></button>
  <div class="err" id="gateErr"></div>
</div></div>

<!-- מנוי -->
<div class="modal" id="payModal"><div class="box">
  <button class="x" onclick="closeM('payModal')">✕</button>
  <h3 id="tPayH"></h3>
  <p class="small" id="tPayP"></p>
  <div class="plans">
    <div class="plan">
      <div id="tMonthly"></div>
      <div class="price" id="pMonthly"></div>
      <div class="sub" id="tPerMonth"></div>
      <a class="paybtn paypal" id="ppMonthly" target="_blank" rel="noopener">PayPal</a>
      <a class="paybtn morning" id="mnMonthly" target="_blank" rel="noopener"></a>
    </div>
    <div class="plan best">
      <div id="tAnnual"></div>
      <div class="price" id="pAnnual"></div>
      <div class="sub" id="tPerYear"></div>
      <a class="paybtn paypal" id="ppAnnual" target="_blank" rel="noopener">PayPal</a>
      <a class="paybtn morning" id="mnAnnual" target="_blank" rel="noopener"></a>
    </div>
  </div>
  <p class="small" id="tPayNote"></p>
  <div class="unlock">
    <b id="tHaveCode"></b><br>
    <input id="codeIn" autocomplete="off" placeholder="FARM-XXXXXX-XXXXXX">
    <button class="pill vip" onclick="checkCode()" id="tCodeGo"></button>
    <div class="err" id="codeErr"></div>
  </div>
</div></div>

function store(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
let lang = qs.get('lang')==='en'?'en':(qs.get('lang')==='he'?'he':(lsGet('sd_lang')||'he'));
let ep = Math.min(12, Math.max(1, parseInt(qs.get('e'))||1));
let page = Math.min(Math.max(1,pageCount(ep)), Math.max(1, parseInt(qs.get('p'))||1));
let tool='fill', color='#ef4444', thick=false, gateAns=0, member=false;
const COLORS=['#ef4444','#f97316','#facc15','#fde68a','#22c55e','#16a34a','#7dd3fc','#06b6d4','#3b82f6','#8b5cf6','#f9a8d4','#ec4899','#f5d0a9','#c68642','#92400e','#9ca3af','#1f2937'];
function isMember(){ return member }
function canPaint(){ return pageCount(ep)>0 && (isFree(ep,page) || isMember()) }

/* ===== ממשק ===== */
function $(id){return document.getElementById(id)}
function btn(el,txt){const i=txt.indexOf(' ');el.innerHTML=`<span class="ic">${txt.slice(0,i)}</span><span class="lbl">${txt.slice(i+1)}</span>`;el.title=txt.slice(i+1);el.setAttribute('aria-label',txt.slice(i+1))}
function render(){
  const t=T[lang];
  document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  document.title=t.title;
  $('tTitle').textContent=t.title; $('tSub').textContent=t.sub; $('langBtn').textContent=t.lang;
  $('parentsBtn').textContent=isMember()?t.codeOk:t.parents;
  $('parentsBtn').className='pill '+(isMember()?'vip':'main');
  $('tSeason').textContent=t.season;
  btn($('bFill'),t.fill); btn($('bBrush'),t.brush); btn($('bEraser'),t.eraser);
  btn($('bSize'),thick?t.thick:t.thin); btn($('bUndo'),t.undo); btn($('bZoom'),t.zoomReset);
  btn($('bFocus'),document.body.classList.contains('focus')?t.exitFocus:t.focus);
  btn($('bClear'),t.clear); btn($('bSave'),t.save); btn($('bPrint'),t.print);
  $('bSize').classList.toggle('hide',tool==='fill');
  $('bUndo').disabled=!undoStack.length;
  $('tLocked').textContent=pageCount(ep)?t.locked:t.soon2; $('tLockedBtn').textContent=t.lockedBtn; $('tFooter').textContent=t.footer;
  $('tGateH').textContent=t.gateH; $('tGateGo').textContent=t.gateGo;
  $('tPayH').textContent=t.payH; $('tPayP').textContent=t.payP; $('tMonthly').textContent=t.monthly; $('tAnnual').textContent=t.annual;
  $('pMonthly').textContent=PRICES[lang].m; $('pAnnual').textContent=PRICES[lang].y; $('tPerMonth').textContent=t.perMonth; $('tPerYear').textContent=t.perYear;
  $('tPayNote').textContent=t.payNote; $('tHaveCode').textContent=t.haveCode; $('tCodeGo').textContent=t.codeGo;
  [['ppMonthly','monthly','paypal','PayPal'],['mnMonthly','monthly','morning',t.morning],['ppAnnual','annual','paypal','PayPal'],['mnAnnual','annual','morning',t.morning]].forEach(([id,plan,prov,label])=>{
    const url=PAY[lang][plan][prov], a=$(id);
    if(url){a.href=url;a.classList.remove('off');a.textContent=label}else{a.removeAttribute('href');a.classList.add('off');a.textContent=label+' · '+t.soon}
  });
  $('eps').innerHTML=t.eps.map((e,i)=>`<button class="ep ${i+1===ep?'on':''} ${pageCount(i+1)?'':'soon'}" onclick="go(${i+1},1)"><span class="n">${i+1}</span><span class="em">${e[1]}</span><span>${e[0]}</span></button>`).join('');
  const onEp=document.querySelector('.ep.on'); if(onEp) onEp.scrollIntoView({block:'nearest',inline:'nearest'});
  $('epTitle').textContent=`${ep}. ${t.eps[ep-1][0]}`;
  let ph=''; for(let p=1;p<=pageCount(ep);p++){const lock=!isFree(ep,p)&&!isMember();
    ph+=`<button class="pg ${p===page?'on':''} ${lock?'locked':''}" onclick="go(${ep},${p})" aria-label="${t.page} ${p}"><img src="thumbs/e${ep}_p${p}.jpg" alt="" loading="lazy"><span class="cap">${lock?'🔒':''}${t.page} ${p}${isFree(ep,p)?` <span class="free">${t.free}</span>`:''}</span></button>`}
  $('pages').innerHTML=ph; $('pages').style.display=pageCount(ep)?'':'none';
  $('palette').innerHTML=COLORS.map(c=>`<button class="sw ${c===color&&tool!=='eraser'?'on':''}" style="background:${c}" onclick="pick('${c}')" aria-label="${c}"></button>`).join('');
  ['Fill','Brush','Eraser'].forEach(n=>$('b'+n).classList.toggle('on',n.toLowerCase()===tool));
  if(document.body.classList.contains('focus')) requestAnimationFrame(layoutFocus);
}
function go(e,p){
  saveArtNow();
  ep=e; page=Math.min(p,Math.max(1,pageCount(e)));
  const u=new URL(location.href); u.searchParams.set('e',ep); u.searchParams.set('p',page); u.searchParams.set('lang',lang);
  history.replaceState(null,'',u);
  render(); loadPage();
}
function switchLang(){lang=lang==='he'?'en':'he'; store('sd_lang',lang); go(ep,page)}
function pick(c){color=c; if(tool==='eraser')tool='brush'; render()}
function setTool(x){tool=x; render()}
function toggleSize(){thick=!thick; render()}

/* ===== קנבס ===== */
const paint=$('paint'), pctx=paint.getContext('2d',{willReadFrequently:true});
const outline=$('outline'), octx=outline.getContext('2d',{willReadFrequently:true});
let oa=null, wm=null; // oa: שקיפות הקווים הנראים · wm: קירות לדלי (הקווים + סגירת פרצות בלתי נראית)
let undoStack=[]; const UNDO_MAX=8;
function pushUndo(){ try{undoStack.push(pctx.getImageData(0,0,W,H)); if(undoStack.length>UNDO_MAX)undoStack.shift()}catch(e){} $('bUndo').disabled=false }
function undo(){ if(!undoStack.length||!canPaint())return; pctx.putImageData(undoStack.pop(),0,0); $('bUndo').disabled=!undoStack.length; saveArtSoon() }
function whiteOut(){pctx.fillStyle='#fff';pctx.fillRect(0,0,W,H)}
function clearColor(user){ if(user){ if(!canPaint())return; pushUndo() } whiteOut(); if(user){saveArtSoon()} }

/* שמירה אוטומטית של הצביעה בכל דף (במכשיר הזה בלבד) */
const ART_MAX=10; let saveTimer=null;
function artKey(){return `sd_art3_e${ep}_p${page}`}
function saveArtSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveArtNow,700) }
function saveArtNow(){
  clearTimeout(saveTimer); saveTimer=null;
  if(!canPaint()||!dirty)return; dirty=false;
  let keys=[]; try{keys=JSON.parse(lsGet('sd_art3_keys')||'[]')}catch(e){}
  const k=artKey(); keys=keys.filter(x=>x!==k); keys.push(k);
  while(keys.length>ART_MAX) lsDel(keys.shift());
  const data=paint.toDataURL('image/png');
  for(let i=0;i<4;i++){ if(store(k,data)){store('sd_art3_keys',JSON.stringify(keys));return} if(keys.length>1) lsDel(keys.shift()); else return }
}
let dirty=false; function changed(){dirty=true; saveArtSoon()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveArtNow()});
window.addEventListener('pagehide',saveArtNow);

let loadToken=0;
function loadPage(){
  const t=T[lang], has=pageCount(ep)>0, locked = has && !isFree(ep,page) && !isMember();
  $('lockIcon').textContent = has ? '🔒' : '🎬';
  $('tLocked').textContent = has ? t.locked : t.soon2;
  $('tLockedBtn').style.display = has ? '' : 'none';
  $('lockov').classList.toggle('show',locked||!has);
  undoStack=[]; $('bUndo').disabled=true; dirty=false; resetZoom();
  whiteOut(); octx.clearRect(0,0,W,H); oa=null; wm=null;
  if(!has) return;
  const my=++loadToken; $('loading').classList.add('show');
  const img=new Image();
  img.onload=()=>{ if(my!==loadToken)return;
    octx.clearRect(0,0,W,H); octx.drawImage(img,0,0,W,H);
    const d=octx.getImageData(0,0,W,H).data; oa=new Uint8Array(W*H); for(let i=0;i<W*H;i++)oa[i]=d[i*4+3];
    $('loading').classList.remove('show');
    const wi=new Image(); wi.onload=()=>{ if(my!==loadToken)return; const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(wi,0,0,W,H); const d2=x.getImageData(0,0,W,H).data; const m=new Uint8Array(W*H); for(let i=0;i<W*H;i++)m[i]=d2[i*4]>127?1:0; wm=m }; wi.src=`pages/e${ep}_p${page}_w.png`;
    const saved=!locked&&lsGet(artKey());
    if(saved){const s=new Image(); s.onload=()=>{ if(my===loadToken){pctx.drawImage(s,0,0,W,H)} }; s.src=saved}
  };
  img.onerror=()=>{ $('loading').classList.remove('show') };
  img.src=`pages/e${ep}_p${page}.png`;
}
function hex(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function flood(x,y,c){
  if(!oa)return;
  const d=pctx.getImageData(0,0,W,H), dp=d.data;
  const wall=i=>wm?wm[i]===1:oa[i]>110;
  if(wall(y*W+x))return;
  const s=(y*W+x)*4; const tr=dp[s],tg=dp[s+1],tb=dp[s+2]; const [r,g,b]=hex(c);
  if(tr===r&&tg===g&&tb===b)return;
  pushUndo();
  const ok=i=>{const q=i*4;return !wall(i)&&Math.abs(dp[q]-tr)<=40&&Math.abs(dp[q+1]-tg)<=40&&Math.abs(dp[q+2]-tb)<=40};
  const done=new Uint8Array(W*H), st=[x+y*W];
  let minY=y,maxY=y;
  while(st.length){
    const i=st.pop(); if(done[i]||!ok(i))continue;
    const row=i-(i%W); let lo=i, hi=i;
    while(lo>row&&!done[lo-1]&&ok(lo-1))lo--;
    while(hi<row+W-1&&!done[hi+1]&&ok(hi+1))hi++;
    const ry=row/W; if(ry<minY)minY=ry; if(ry>maxY)maxY=ry;
    for(let k=lo;k<=hi;k++){
      done[k]=1; const q=k*4; dp[q]=r;dp[q+1]=g;dp[q+2]=b;dp[q+3]=255;
      if(k>=W&&!done[k-W])st.push(k-W);
      if(k<W*(H-1)&&!done[k+W])st.push(k+W);
    }
  }
  // צובע גם את שולי הקו הרכים ואת פסי סגירת הפרצות הבלתי נראים שליד האזור, כדי שלא יישאר קו לבן
  const y0=Math.max(0,minY-3), y1=Math.min(H-1,maxY+3);
  for(let pass=0;pass<3;pass++){ const add=[];
    for(let k=y0*W;k<(y1+1)*W;k++){ if(done[k])continue; if(oa[k]>230)continue; if(!(wm?wm[k]:oa[k]>0))continue;
      if((k%W>0&&done[k-1])||(k%W<W-1&&done[k+1])||(k>=W&&done[k-W])||(k<W*(H-1)&&done[k+W])) add.push(k) }
    for(const k of add){done[k]=1;const q=k*4;dp[q]=r;dp[q+1]=g;dp[q+2]=b;dp[q+3]=255} }
  pctx.putImageData(d,0,0); changed();
}

/* ===== מגע: אצבע אחת צובעת, שתי אצבעות מגדילות ומזיזות ===== */
const stage=$('stage'), zoomer=$('zoomer');
const Z={s:1,x:0,y:0};
function applyZoom(){
  const r=stage.getBoundingClientRect();
  Z.s=Math.min(6,Math.max(1,Z.s));
  Z.x=Math.min(0,Math.max(r.width*(1-Z.s),Z.x)); Z.y=Math.min(0,Math.max(r.height*(1-Z.s),Z.y));
  zoomer.style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;
  $('bZoom').classList.toggle('hide',Z.s<=1.01);
}
function resetZoom(){Z.s=1;Z.x=0;Z.y=0;applyZoom()}
function pos(e){const r=paint.getBoundingClientRect();return[Math.min(W-1,Math.max(0,Math.floor((e.clientX-r.left)*W/r.width))),Math.min(H-1,Math.max(0,Math.floor((e.clientY-r.top)*H/r.height)))]}
function local(e){const r=stage.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
const ptrs=new Map(); let stroke=null, tap=null, pinch=null, blocked=false;
function brushWidth(){return (tool==='eraser'?(thick?70:36):(thick?34:14))/Math.sqrt(Z.s)}
stage.addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); try{stage.setPointerCapture(e.pointerId)}catch(_){}
  if(ptrs.size===1){
    blocked=false;
    if(!canPaint())return;
    if(tool==='fill'){ tap={id:e.pointerId,x:e.clientX,y:e.clientY,p:pos(e)}; return }
    pushUndo();
    const [x,y]=pos(e); stroke={id:e.pointerId};
    pctx.lineCap='round';pctx.lineJoin='round';pctx.lineWidth=brushWidth();pctx.strokeStyle=tool==='eraser'?'#fff':color;
    pctx.beginPath();pctx.moveTo(x,y);pctx.lineTo(x+0.1,y);pctx.stroke();
  } else if(ptrs.size===2){
    // אצבע שנייה: מבטלים את הצביעה שהתחילה ועוברים להגדלה
    if(stroke){ if(undoStack.length) pctx.putImageData(undoStack.pop(),0,0); $('bUndo').disabled=!undoStack.length; stroke=null }
    tap=null; blocked=true;
    const [a,b]=[...ptrs.values()]; const r=stage.getBoundingClientRect();
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1, mx:(a.x+b.x)/2-r.left, my:(a.y+b.y)/2-r.top, s:Z.s, x:Z.x, y:Z.y};
  }
});
stage.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){
    const [a,b]=[...ptrs.values()]; const r=stage.getBoundingClientRect();
    const d=Math.hypot(a.x-b.x,a.y-b.y)||1, mx=(a.x+b.x)/2-r.left, my=(a.y+b.y)/2-r.top;
    const s=Math.min(6,Math.max(1,pinch.s*d/pinch.d));
    const cx=(pinch.mx-pinch.x)/pinch.s, cy=(pinch.my-pinch.y)/pinch.s;
    Z.s=s; Z.x=mx-cx*s; Z.y=my-cy*s; applyZoom(); return;
  }
  if(stroke&&stroke.id===e.pointerId){
    const ev=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const c of (ev.length?ev:[e])){const[x,y]=pos(c);pctx.lineTo(x,y)} pctx.stroke(); return;
  }
  if(tap&&tap.id===e.pointerId&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>18) tap=null;
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  if(tap&&tap.id===e.pointerId&&e.type==='pointerup'&&!blocked){ flood(tap.p[0],tap.p[1],color) }
  tap=null;
  if(stroke&&stroke.id===e.pointerId){ stroke=null; changed() }
  if(ptrs.size<2) pinch=null;
}
['pointerup','pointercancel','lostpointercapture'].forEach(n=>stage.addEventListener(n,endPtr));
stage.addEventListener('wheel',e=>{
  if(!canPaint())return; e.preventDefault();
  const [mx,my]=local(e); const s=Math.min(6,Math.max(1,Z.s*(e.deltaY<0?1.15:1/1.15)));
  const cx=(mx-Z.x)/Z.s, cy=(my-Z.y)/Z.s; Z.s=s; Z.x=mx-cx*s; Z.y=my-cy*s; applyZoom();
},{passive:false});
stage.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault()); // ספארי: לא להגדיל את כל הדף

/* ===== מסך מלא לציור ===== */
let autoFocus=false;
function toggleFocus(fromAuto){
  const on=!document.body.classList.contains('focus'); autoFocus=on&&fromAuto===true;
  document.body.classList.toggle('focus',on);
  if(on){ if(!autoFocus) try{ const el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el) }catch(_){} showHint(T[lang].pinch) }
  else{ try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(_){} stage.style.cssText=''; }
  render(); resetZoom(); layoutFocus();
}
function layoutFocus(){
  if(!document.body.classList.contains('focus')){stage.style.cssText='';return}
  const vw=window.innerWidth, vh=window.innerHeight, tb=$('toolbar').getBoundingClientRect(), side=tb.height>vh*0.8;
  const pad=8, availW=(side?vw-tb.width:vw)-pad*2, availH=(side?vh:vh-tb.height)-pad*2;
  let w=availW, h=w*9/16; if(h>availH){h=availH;w=h*16/9}
  const rtl=document.documentElement.dir==='rtl';
  const left=side? (rtl? tb.width+(availW-w)/2+pad : (availW-w)/2+pad) : (vw-w)/2;
  const top=side? (vh-h)/2 : pad+(availH-h)/2;
  stage.style.cssText=`width:${w}px;height:${h}px;left:${left}px;top:${top}px`;
  applyZoom();
}
// טלפון לרוחב: נכנסים אוטומטית למצב ציור; חזרה לאורך יוצאת ממנו
const phoneLand=matchMedia('(orientation: landscape) and (max-height: 500px)');
function autoFocusCheck(){ const f=document.body.classList.contains('focus');
  if(phoneLand.matches&&!f) toggleFocus(true); else if(!phoneLand.matches&&f&&autoFocus) toggleFocus(); }
window.addEventListener('resize',()=>{autoFocusCheck();layoutFocus();applyZoom()});
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement&&document.body.classList.contains('focus')){ document.body.classList.remove('focus'); stage.style.cssText=''; render(); resetZoom() } });
let hintT=null;
function showHint(txt){const h=$('hint'); h.textContent=txt; h.classList.add('show'); clearTimeout(hintT); hintT=setTimeout(()=>h.classList.remove('show'),3500)}
function rotateHint(){ if(window.innerWidth<600&&window.innerHeight>window.innerWidth&&!lsGet('sd_rot_hint')){ store('sd_rot_hint','1'); showHint(T[lang].rotate) } }

/* ===== שמירה והדפסה ===== */
function composite(){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(paint,0,0);x.drawImage(outline,0,0);return c}
function savePng(){ if(!canPaint())return; const c=composite(), name=`sandy-danny-e${ep}-p${page}.png`;
  c.toBlob(async b=>{
    try{ const f=new File([b],name,{type:'image/png'}); if(navigator.canShare&&navigator.canShare({files:[f]})&&/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)){ await navigator.share({files:[f],title:T[lang].title}); return } }catch(_){}
    const a=document.createElement('a'); a.download=name; a.href=URL.createObjectURL(b); a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },'image/png') }
function printPage(){ if(!canPaint())return; const im=$('printImg'); im.onload=()=>{window.print()}; im.src=composite().toDataURL('image/png') }

/* ===== שער הורים, מנוי וקוד ===== */
function openM(id){$(id).classList.add('show')}
function closeM(id){$(id).classList.remove('show')}
function openGate(){
  const a=6+Math.floor(Math.random()*7), b=5+Math.floor(Math.random()*8); gateAns=a*b;
  $('tGateQ').textContent=`${T[lang].gateQ} ${a} × ${b}?`; $('gateIn').value=''; $('gateErr').textContent=''; openM('gateModal'); setTimeout(()=>$('gateIn').focus(),50);
}
function checkGate(){ if(parseInt($('gateIn').value)===gateAns){closeM('gateModal');$('codeErr').textContent='';openM('payModal')} else $('gateErr').textContent=T[lang].gateErr }
$('gateIn').addEventListener('keydown',e=>{if(e.key==='Enter')checkGate()});
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function checkCode(){
  const v=$('codeIn').value.trim().toUpperCase();
  if(await sha(v)===UNLOCK_HASH){store('sd_code',v);member=true;closeM('payModal');render();loadPage()}
  else $('codeErr').textContent=T[lang].codeErr;
}
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show')}));

render(); loadPage(); rotateHint(); autoFocusCheck();
// המנוי נשמר כקוד עצמו ונבדק מול הטביעה בכל טעינה, כך שאי אפשר "לזייף" מנוי בהעתקת הטביעה מהקוד
(async()=>{ try{ lsDel('sd_member'); const c=lsGet('sd_code'); if(c && await sha(c)===UNLOCK_HASH){member=true; render(); loadPage()} }catch(e){} })();
</script>
