<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מועדון הצביעה של סנדי ודני</title>
<meta name="description" content="דפי צביעה חינמיים מכל פרק בסדרה סנדי ודני · Free coloring pages from every Sandy And Danny episode">
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ef;--card:#fff;--ink:#2b2340;--muted:#6f6680;--line:#f0e2cf;--pink:#e2557f;--blue:#3a7bd5;--green:#3d9a5b;--yellow:#ffd34d;--lock:#b9a9c9}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Varela Round",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
header{background:#fff;border-bottom:3px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{font-size:30px}
.brand h1{font-size:19px;margin:0;color:var(--pink)}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.hbtns{display:flex;gap:8px;align-items:center}
.pill{border:2px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-size:14px;font-weight:bold;color:var(--ink)}
.pill.main{background:var(--blue);border-color:var(--blue);color:#fff}
.pill.vip{background:var(--green);border-color:var(--green);color:#fff}
main{flex:1;width:100%;max-width:1150px;margin:0 auto;padding:14px 16px;display:grid;grid-template-columns:270px 1fr;gap:14px}
@media(max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
.card{min-width:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px}
aside h2{font-size:15px;margin:2px 4px 10px}
.eps{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
@media(max-width:860px){.eps{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:4px}}
.ep{flex-shrink:0;display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 10px;text-align:start;font-size:14px;color:var(--ink);min-width:200px}
.ep .n{background:var(--yellow);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:bold;flex-shrink:0}
.ep.on{border-color:var(--pink);background:#fff0f4}
.ep .em{font-size:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top h2{margin:0;font-size:18px}
.pages{display:flex;gap:6px;flex-wrap:wrap}
.pg{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;font-size:13px;font-weight:bold;color:var(--ink)}
.pg.on{background:var(--pink);border-color:var(--pink);color:#fff}
.pg.locked{color:var(--lock)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:10px}
.tgroup{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tool{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:15px;font-weight:bold;color:var(--ink)}
.tool.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--ink);transform:scale(1.1)}
.stage{position:relative;margin-top:10px;width:100%;aspect-ratio:16/9;background:#fff;border-radius:16px;overflow:hidden;border:3px solid var(--line);touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
#outline{pointer-events:none}
.lockov{position:absolute;inset:0;background:rgba(255,248,239,.93);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}
.lockov.show{display:flex}
.loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:48px;animation:pulse 1s infinite alternate;pointer-events:none}
.loading.show{display:flex}
@keyframes pulse{from{opacity:.3}to{opacity:1}}
.ep.soon{opacity:.55}
.lockov .big{font-size:54px}
.lockov p{margin:0;max-width:420px}
.free{display:inline-block;background:var(--green);color:#fff;border-radius:99px;padding:2px 10px;font-size:12px;margin-inline-start:6px;vertical-align:middle}
footer{text-align:center;font-size:12px;color:var(--muted);padding:14px 16px 24px}
footer a{color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(43,35,64,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.show{display:flex}
.box{background:#fff;border-radius:22px;max-width:620px;width:100%;padding:20px;max-height:92vh;overflow:auto;position:relative}
.box h3{margin:0 0 8px;font-size:21px}
.x{position:absolute;inset-inline-end:12px;top:10px;border:none;background:none;font-size:22px;color:var(--muted)}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
@media(max-width:520px){.plans{grid-template-columns:1fr}}
.plan{border:3px solid var(--line);border-radius:18px;padding:14px;text-align:center}
.plan.best{border-color:var(--green)}
.plan .price{font-size:30px;font-weight:bold;margin:6px 0}
.plan .sub{font-size:13px;color:var(--muted)}
.paybtn{display:block;width:100%;margin-top:8px;border:none;border-radius:12px;padding:10px;font-size:15px;font-weight:bold;color:#fff;text-decoration:none}
.paypal{background:#0070ba}
.morning{background:#7a4fd1}
.paybtn.off{background:#cfc6da;pointer-events:none}
.gate input,.unlock input{font-size:20px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;width:140px;text-align:center}
.unlock input{width:240px;font-size:16px}
.err{color:#c0392b;font-size:14px;min-height:18px}
.small{font-size:13px;color:var(--muted)}
#printImg{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff}
  header,main,footer,.modal{display:none!important}
  #printImg{display:block;width:100%;height:auto}
}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">🎨</span><div><h1 id="tTitle"></h1><p id="tSub"></p></div></div>
  <div class="hbtns">
    <button class="pill" id="langBtn" onclick="switchLang()"></button>
    <button class="pill main" id="parentsBtn" onclick="openGate()"></button>
  </div>
</header>

<main>
  <aside class="card">
    <h2 id="tSeason"></h2>
    <div class="eps" id="eps"></div>
  </aside>
  <section class="card">
    <div class="top">
      <h2 id="epTitle"></h2>
      <div class="pages" id="pages"></div>
    </div>
    <div class="tools">
      <div class="tgroup">
        <button class="tool on" id="tFill" onclick="setTool('fill')"></button>
        <button class="tool" id="tBrush" onclick="setTool('brush')"></button>
        <button class="tool" id="tEraser" onclick="setTool('eraser')"></button>
      </div>
      <div class="tgroup" id="palette"></div>
      <div class="tgroup">
        <button class="tool" id="tClear" onclick="clearColor()"></button>
        <button class="tool" id="tSave" onclick="savePng()"></button>
        <button class="tool" id="tPrint" onclick="printPage()"></button>
      </div>
    </div>
    <div class="stage" id="stage">
      <canvas id="paint" width="1600" height="900"></canvas>
      <canvas id="outline" width="1600" height="900"></canvas>
      <div class="loading" id="loading">🎨</div>
      <div class="lockov" id="lockov">
        <div class="big" id="lockIcon">🔒</div>
        <p id="tLocked"></p>
        <button class="pill main" onclick="openGate()" id="tLockedBtn"></button>
      </div>
    </div>
  </section>
</main>

<footer><span id="tFooter"></span><br>SHAHAR AI PRODUCTIONS · <a href="mailto:shaharprod@gmail.com">shaharprod@gmail.com</a></footer>

<img id="printImg" alt="">

<!-- שער הורים -->
<div class="modal" id="gateModal"><div class="box gate">
  <button class="x" onclick="closeM('gateModal')">✕</button>
  <h3 id="tGateH"></h3>
  <p id="tGateQ"></p>
  <input id="gateIn" inputmode="numeric" autocomplete="off">
  <button class="pill main" onclick="checkGate()" id="tGateGo"></button>
  <div class="err" id="gateErr"></div>
</div></div>

<!-- מנוי -->
<div class="modal" id="payModal"><div class="box">
  <button class="x" onclick="closeM('payModal')">✕</button>
  <h3 id="tPayH"></h3>
  <p class="small" id="tPayP"></p>
  <div class="plans">
    <div class="plan">
      <div id="tMonthly"></div>
      <div class="price" id="pMonthly"></div>
      <div class="sub" id="tPerMonth"></div>
      <a class="paybtn paypal" id="ppMonthly" target="_blank" rel="noopener">PayPal</a>
      <a class="paybtn morning" id="mnMonthly" target="_blank" rel="noopener"></a>
    </div>
    <div class="plan best">
      <div id="tAnnual"></div>
      <div class="price" id="pAnnual"></div>
      <div class="sub" id="tPerYear"></div>
      <a class="paybtn paypal" id="ppAnnual" target="_blank" rel="noopener">PayPal</a>
      <a class="paybtn morning" id="mnAnnual" target="_blank" rel="noopener"></a>
    </div>
  </div>
  <p class="small" id="tPayNote"></p>
  <div class="unlock">
    <b id="tHaveCode"></b><br>
    <input id="codeIn" autocomplete="off" placeholder="FARM-XXXXXX-XXXXXX">
    <button class="pill vip" onclick="checkCode()" id="tCodeGo"></button>
    <div class="err" id="codeErr"></div>
  </div>
</div></div>

<script>
/* ===== הגדרות שמשנים בלי לגעת בקוד ===== */
// קישורי תשלום: מדביקים כאן את הקישורים מ-PayPal ומ-Morning. כל עוד ריק, הכפתור מוצג "בקרוב".
const PAY = {
  he:{monthly:{paypal:"",morning:""}, annual:{paypal:"",morning:""}},
  en:{monthly:{paypal:"",morning:""}, annual:{paypal:"",morning:""}}
};
const PRICES = {he:{m:"22.40 ₪",y:"134 ₪"}, en:{m:"$6.29",y:"$35.99"}};
// טביעת SHA-256 של קוד הפתיחה למנויים (הקוד עצמו לא נמצא בקובץ)
const UNLOCK_HASH = "cd6ab2fe9025eb3281f59b89340a6e7c131a7e3c6e2fd25be4d14871f458fc55";

/* ===== טקסטים ===== */
const T = {
he:{dir:"rtl",title:"מועדון הצביעה של סנדי ודני",sub:"עונה 1 · בחווה של סבא וסבתא",lang:"English",parents:"👪 להורים",season:"🚜 פרקי העונה",page:"דף",fill:"🪣 דלי",brush:"🖌️ מכחול",eraser:"🧽 מחק",clear:"🗑️ נקה",save:"💾 שמור",print:"🖨️ הדפס",free:"חינם",
locked:"הדף הזה פתוח למנויי המועדון. דף 1 של כל פרק חינם תמיד.",lockedBtn:"👪 להורים: פתיחת כל הדפים",
footer:"דף 1 בכל פרק חינמי תמיד, בלי הרשמה ובלי מייל. האתר לא אוסף שום מידע מילדים.",
gateH:"אזור הורים",gateQ:"כדי להמשיך, כמה זה",gateGo:"המשך",gateErr:"לא נכון, נסו שוב",
payH:"מנוי למועדון הצביעה",payP:"כל דפי הצביעה מכל הפרקים, וחוברת חדשה עם כל פרק. אפשר לבטל בכל רגע.",
monthly:"מנוי חודשי",annual:"מנוי שנתי · משתלם",perMonth:"לחודש",perYear:"לשנה (פחות מ-11.20 ₪ לחודש)",morning:"אשראי / ביט (Morning)",soon:"בקרוב",
payNote:"אחרי התשלום יישלח אליכם במייל קוד פתיחה. מזינים אותו כאן, פעם אחת בכל מכשיר.",haveCode:"כבר יש לכם קוד?",codeGo:"פתיחה",codeErr:"הקוד לא תקין",codeOk:"✅ מנוי פעיל",soon2:"דפי הצביעה של הפרק הזה יעלו ביום שהפרק יוצא",
eps:[["נוסעים לחווה!","🏡"],["הביצה של מוצי","🐔"],["מו! הפרה שאוהבת לשיר","🐄"],["הכבשה והצמר","🐑"],["העז הקופצת","🐐"],["הסוס שפחד","🐴"],["החמור העקשן","🫏"],["הברווזונים בבריכה","🦆"],["הארנבון שנעלם","🐰"],["הדבורים והדבש","🐝"],["התרנגול שקם מוקדם","🐓"],["חג החווה!","🎉"]]},
en:{dir:"ltr",title:"Sandy And Danny Coloring Club",sub:"Season 1 · At Grandpa and Grandma's Farm",lang:"עברית",parents:"👪 Parents",season:"🚜 Season episodes",page:"Page",fill:"🪣 Fill",brush:"🖌️ Brush",eraser:"🧽 Eraser",clear:"🗑️ Clear",save:"💾 Save",print:"🖨️ Print",free:"Free",
locked:"This page is for club members. Page 1 of every episode is always free.",lockedBtn:"👪 Parents: unlock all pages",
footer:"Page 1 of every episode is always free, no sign-up and no email. This site collects no data from children.",
gateH:"Parents' area",gateQ:"To continue, what is",gateGo:"Continue",gateErr:"Not quite, try again",
payH:"Coloring Club membership",payP:"Every coloring page from every episode, plus a new book with each episode. Cancel anytime.",
monthly:"Monthly",annual:"Yearly · best value",perMonth:"per month",perYear:"per year (under $3 a month)",morning:"Card (Morning)",soon:"Coming soon",
payNote:"After payment you'll get an unlock code by email. Enter it here once on each device.",haveCode:"Already have a code?",codeGo:"Unlock",codeErr:"That code isn't valid",codeOk:"✅ Membership active",soon2:"This episode’s coloring pages arrive the day the episode comes out",
eps:[["Off to the Farm!","🏡"],["Who Laid the Egg?","🐔"],["Moo-sic Cow","🐄"],["The Fluffy Sheep","🐑"],["The Jumping Goat","🐐"],["The Shy Horse","🐴"],["Stubborn Donkey","🫏"],["Ducklings in a Row","🦆"],["The Missing Bunny","🐰"],["Busy Bees","🐝"],["The Early Rooster","🐓"],["Farm Festival!","🎉"]]}
};

/* ===== דפי צביעה: קווים שחורים על רקע שקוף, נוצרו מהפריימים של כל פרק ===== */
// כמה דפים יש לכל פרק. פרק שעוד לא יצא מקבל 0 ומוצג "בקרוב".
const PAGES = {1:4, 2:4};
const W=1600, H=900;
function pageCount(e){return PAGES[e]||0}

/* ===== מצב ===== */
const qs = new URLSearchParams(location.search);
let lang = qs.get('lang')==='en' ? 'en' : (localStorage.getItem('sd_lang')||'he');
if(qs.get('lang')) lang = qs.get('lang')==='en'?'en':'he';
let ep = Math.min(12, Math.max(1, parseInt(qs.get('e'))||1));
let page = Math.min(Math.max(1,pageCount(ep)), Math.max(1, parseInt(qs.get('p'))||1));
let tool='fill', color='#ef4444', drawing=false, gateAns=0;
const COLORS=['#ef4444','#f97316','#facc15','#22c55e','#16a34a','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#f5d0a9','#92400e','#9ca3af','#1f2937'];
function isMember(){ try{return localStorage.getItem('sd_member')===UNLOCK_HASH}catch(e){return false} }
function store(k,v){ try{localStorage.setItem(k,v)}catch(e){} }

/* ===== ממשק ===== */
function $(id){return document.getElementById(id)}
function render(){
  const t=T[lang];
  document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  document.title=t.title;
  $('tTitle').textContent=t.title; $('tSub').textContent=t.sub; $('langBtn').textContent=t.lang;
  $('parentsBtn').textContent=isMember()?t.codeOk:t.parents;
  $('parentsBtn').className='pill '+(isMember()?'vip':'main');
  $('tSeason').textContent=t.season;
  ['fill','brush','eraser','clear','save','print'].forEach(k=>$('t'+k[0].toUpperCase()+k.slice(1)).textContent=t[k]);
  $('tLocked').textContent=pageCount(ep)?t.locked:t.soon2; $('tLockedBtn').textContent=t.lockedBtn; $('tFooter').textContent=t.footer;
  $('tGateH').textContent=t.gateH; $('tGateGo').textContent=t.gateGo;
  $('tPayH').textContent=t.payH; $('tPayP').textContent=t.payP; $('tMonthly').textContent=t.monthly; $('tAnnual').textContent=t.annual;
  $('pMonthly').textContent=PRICES[lang].m; $('pAnnual').textContent=PRICES[lang].y; $('tPerMonth').textContent=t.perMonth; $('tPerYear').textContent=t.perYear;
  $('tPayNote').textContent=t.payNote; $('tHaveCode').textContent=t.haveCode; $('tCodeGo').textContent=t.codeGo;
  [['ppMonthly','monthly','paypal','PayPal'],['mnMonthly','monthly','morning',t.morning],['ppAnnual','annual','paypal','PayPal'],['mnAnnual','annual','morning',t.morning]].forEach(([id,plan,prov,label])=>{
    const url=PAY[lang][plan][prov], a=$(id);
    if(url){a.href=url;a.classList.remove('off');a.textContent=label}else{a.removeAttribute('href');a.classList.add('off');a.textContent=label+' · '+t.soon}
  });
  $('eps').innerHTML=t.eps.map((e,i)=>`<button class="ep ${i+1===ep?'on':''} ${pageCount(i+1)?'':'soon'}" onclick="go(${i+1},1)"><span class="n">${i+1}</span><span class="em">${e[1]}</span><span>${e[0]}</span></button>`).join('');
  const onEp=document.querySelector('.ep.on'); if(onEp) onEp.scrollIntoView({block:'nearest',inline:'nearest'});
  $('epTitle').innerHTML=`${ep}. ${t.eps[ep-1][0]}`;
  let ph=''; for(let p=1;p<=pageCount(ep);p++){const lock=p>1&&!isMember();ph+=`<button class="pg ${p===page?'on':''} ${lock?'locked':''}" onclick="go(${ep},${p})">${lock?'🔒 ':''}${t.page} ${p}${p===1?` <span class="free">${t.free}</span>`:''}</button>`}
  $('pages').innerHTML=ph;
  $('palette').innerHTML=COLORS.map(c=>`<button class="sw ${c===color?'on':''}" style="background:${c}" onclick="pick('${c}')" aria-label="${c}"></button>`).join('');
  ['Fill','Brush','Eraser'].forEach(n=>$('t'+n).classList.toggle('on',n.toLowerCase()===tool));
}
function go(e,p){
  ep=e; page=Math.min(p,Math.max(1,pageCount(e)));
  const u=new URL(location.href); u.searchParams.set('e',ep); u.searchParams.set('p',page); u.searchParams.set('lang',lang);
  history.replaceState(null,'',u);
  render(); loadPage();
}
function switchLang(){lang=lang==='he'?'en':'he'; store('sd_lang',lang); go(ep,page)}
function pick(c){color=c; if(tool==='eraser')tool='brush'; render()}
function setTool(x){tool=x; render()}

/* ===== קנבס ===== */
const paint=$('paint'), pctx=paint.getContext('2d',{willReadFrequently:true});
const outline=$('outline'), octx=outline.getContext('2d',{willReadFrequently:true});
function clearColor(){pctx.fillStyle='#fff';pctx.fillRect(0,0,W,H)}
let loadToken=0;
function loadPage(){
  const t=T[lang], has=pageCount(ep)>0, locked = has && page>1 && !isMember();
  $('lockIcon').textContent = has ? '🔒' : '🎬';
  $('tLocked').textContent = has ? t.locked : t.soon2;
  $('tLockedBtn').style.display = has ? '' : 'none';
  $('lockov').classList.toggle('show',locked||!has);
  clearColor(); octx.clearRect(0,0,W,H);
  if(!has) return;
  const my=++loadToken; $('loading').classList.add('show');
  const img=new Image();
  img.onload=()=>{ if(my!==loadToken)return; octx.clearRect(0,0,W,H); octx.drawImage(img,0,0,W,H); $('loading').classList.remove('show') };
  img.onerror=()=>{ $('loading').classList.remove('show') };
  img.src=`pages/e${ep}_p${page}.png`;
}
function hex(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function flood(x,y,c){
  const d=pctx.getImageData(0,0,W,H), o=octx.getImageData(0,0,W,H), dp=d.data, op=o.data;
  const s=(y*W+x)*4; if(op[s+3]>110)return;
  const tr=dp[s],tg=dp[s+1],tb=dp[s+2]; const [r,g,b]=hex(c);
  if(tr===r&&tg===g&&tb===b)return;
  const ok=i=>{const q=i*4;return op[q+3]<=110&&Math.abs(dp[q]-tr)<=40&&Math.abs(dp[q+1]-tg)<=40&&Math.abs(dp[q+2]-tb)<=40};
  const done=new Uint8Array(W*H), st=[x+y*W];
  let minY=y,maxY=y;
  while(st.length){
    const i=st.pop(); if(done[i]||!ok(i))continue;
    const row=i-(i%W); let lo=i, hi=i;
    while(lo>row&&!done[lo-1]&&ok(lo-1))lo--;
    while(hi<row+W-1&&!done[hi+1]&&ok(hi+1))hi++;
    const ry=row/W; if(ry<minY)minY=ry; if(ry>maxY)maxY=ry;
    for(let k=lo;k<=hi;k++){
      done[k]=1; const q=k*4; dp[q]=r;dp[q+1]=g;dp[q+2]=b;dp[q+3]=255;
      if(k>=W&&!done[k-W])st.push(k-W);
      if(k<W*(H-1)&&!done[k+W])st.push(k+W);
    }
  }
  // צובע גם את שולי הקו הרכים שליד האזור, כדי שלא תישאר הילה לבנה
  const y0=Math.max(0,minY-1), y1=Math.min(H-1,maxY+1);
  for(let k=y0*W;k<(y1+1)*W;k++){ if(done[k])continue; const q=k*4; const a=op[q+3]; if(a===0||a>230)continue;
    if((k%W>0&&done[k-1])||(k%W<W-1&&done[k+1])||(k>=W&&done[k-W])||(k<W*(H-1)&&done[k+W])){dp[q]=r;dp[q+1]=g;dp[q+2]=b;dp[q+3]=255} }
  pctx.putImageData(d,0,0);
}
function pos(e){const r=paint.getBoundingClientRect();return[Math.min(W-1,Math.max(0,Math.floor((e.clientX-r.left)*W/r.width))),Math.min(H-1,Math.max(0,Math.floor((e.clientY-r.top)*H/r.height)))]}
paint.addEventListener('pointerdown',e=>{
  if(!pageCount(ep)||(page>1&&!isMember()))return;
  const [x,y]=pos(e);
  if(tool==='fill'){flood(x,y,color);return}
  drawing=true; paint.setPointerCapture(e.pointerId);
  pctx.lineCap='round';pctx.lineJoin='round';pctx.lineWidth=tool==='eraser'?60:30;pctx.strokeStyle=tool==='eraser'?'#fff':color;
  pctx.beginPath();pctx.moveTo(x,y);pctx.lineTo(x+0.1,y);pctx.stroke();
});
paint.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=pos(e);pctx.lineTo(x,y);pctx.stroke()});
['pointerup','pointercancel'].forEach(n=>paint.addEventListener(n,()=>{drawing=false}));
function composite(){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(paint,0,0);x.drawImage(outline,0,0);return c.toDataURL('image/png')}
function savePng(){if(!pageCount(ep)||(page>1&&!isMember()))return;const a=document.createElement('a');a.download=`sandy-danny-e${ep}-p${page}.png`;a.href=composite();a.click()}
function printPage(){if(!pageCount(ep)||(page>1&&!isMember()))return;const im=$('printImg');im.onload=()=>{window.print()};im.src=composite()}

/* ===== שער הורים, מנוי וקוד ===== */
function openM(id){$(id).classList.add('show')}
function closeM(id){$(id).classList.remove('show')}
function openGate(){
  const a=6+Math.floor(Math.random()*7), b=5+Math.floor(Math.random()*8); gateAns=a*b;
  $('tGateQ').textContent=`${T[lang].gateQ} ${a} × ${b}?`; $('gateIn').value=''; $('gateErr').textContent=''; openM('gateModal'); setTimeout(()=>$('gateIn').focus(),50);
}
function checkGate(){ if(parseInt($('gateIn').value)===gateAns){closeM('gateModal');$('codeErr').textContent='';openM('payModal')} else $('gateErr').textContent=T[lang].gateErr }
$('gateIn').addEventListener('keydown',e=>{if(e.key==='Enter')checkGate()});
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function checkCode(){
  const v=$('codeIn').value.trim().toUpperCase();
  if(await sha(v)===UNLOCK_HASH){store('sd_member',UNLOCK_HASH);closeM('payModal');render();loadPage()}
  else $('codeErr').textContent=T[lang].codeErr;
}
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show')}));

render(); loadPage();
</script>
